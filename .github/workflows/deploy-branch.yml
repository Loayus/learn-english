# À chaque push sur main : lance les tests, compile le front React et publie
# le tout (avec frontend/dist) sur la branche `deploy`, prête pour PythonAnywhere.
name: Branche deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de l'API
        run: |
          pip install -r requirements.txt
          cd backend && python -m unittest test_app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du front
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publication sur la branche deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          git add -f frontend/dist
          git commit -m "Build de ${GITHUB_SHA::7}"
          git push --force origin deploy
